<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Project Copper — help Dalton strip the school for copper and get it to the white van without Mr. Gravy catching him." />
    <meta name="theme-color" content="#14161c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Copper" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Project Copper</title>
    <style>
      :root {
        --bg: #14161c;
        --text: #f6f1e5;
        --accent: #e8914a;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #14161c;
          --text: #f6f1e5;
        }
      }
      :root[data-theme='dark'] {
        --bg: #14161c;
        --text: #f6f1e5;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Keep the game clear of notches / home indicators. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0);
        right: env(safe-area-inset-right, 0);
        bottom: env(safe-area-inset-bottom, 0);
        left: env(safe-area-inset-left, 0);
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: var(--bg);
        color: var(--text);
        font: 700 22px/1.4 'Arial Black', Arial, sans-serif;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        padding: 16px;
      }
      #rotate .phone {
        width: 56px;
        height: 96px;
        border: 6px solid var(--accent);
        border-radius: 12px;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 20% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone"></div>
      <div>Turn your phone sideways to play</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
